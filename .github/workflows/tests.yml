name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            db: mysql:8.0
          - php: '8.3'
            db: mariadb:10.11
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, fileinfo, gd, zip, curl
          ini-values: upload_max_filesize=6M, post_max_size=32M
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - run: vendor/bin/phpunit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: root
